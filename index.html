<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style/style.css">
  <title>Alivio</title>
</head>
<body>
  <!-- Шапка сайта -->
  <header class="header">
    <div class="container">
      <div class="header__menu">
        <img src="img/header__logo.svg" alt="Alivio" class="neader__logo">
        <nav class="header__links">
          <ul class="header__links-list">
            <li class="header__links-list-item">
              <a href="#0" class="header__link">
                Why Alivio
              </a>
            </li>
            <li class="header__links-list-item">
              <a href="#0" class="header__link">
                Solutions
              </a>
            </li>
            <li class="header__links-list-item">
              <a href="#0" class="header__link">
                Community
              </a>
            </li>
            <li class="header__links-list-item">
              <a href="#0" class="header__link">
                Pricing
              </a>
            </li>
          </ul>
        </nav>
        <div class="header__buttons">
          <a class="button__sign" href="#0">
            Sign in
          </a>
          <a class="button__start" href="#0">
            Start Trial
          </a>
        </div>
      </div>
    </div>
    <div class="header__background">
      <div class="container">
        <h1 class="header__title">
        Be aware, Manage well.
        </h1>
        <p class="header__text">
          Everyone experiences stress in different ways.
          Let Alivio guide you, in a personalized journal experience, to overcome your stress
        </p>
        <button class="header__button">
          Find Your Way
        </button>
      </div>
    </div>
  </header>
  
  <!-- Подвал сайта -->
  <footer class="footer">
    <div class="container">
      <img class="footer__logo" src="img/Alivio_footer.svg" alt="Alivio">
      <nav class="footer__menu">
        <ul class="footer__menu-list">
          <li class="footer__menu-item">
            <a class="footer__menu-list-link" href="#0">Why Alivio</a>
          </li>
          <li class="footer__menu-item">
            <a class="footer__menu-list-link" href="#0">Solutions</a>
          </li>
          <li class="footer__menu-item">
            <a class="footer__menu-list-link" href="#0">Community</a>
          </li>
          <li class="footer__menu-item">
            <a class="footer__menu-list-link" href="#0">Pricing</a>
          </li>
        </ul>
      </nav>
    </div>
  </footer>
</body>
</html>
